name: astrbot_plugin_keyword_reply
display_name: 关键词自动回复
desc: 检测消息中的关键词（支持句子中间匹配，可开启整词匹配防英文/数字粘连误触发）并自动回复，支持多关键词、多条多行回复、图文混排（[图片] 标记 / WebUI 上传图片池）、可选引用原消息、同一用户触发冷却防刷屏，可在 WebUI 配置。
version: v1.6.0
author: xiaohao234
repo: https://github.com/xiaohao234/astrbot_plugin_keyword_reply
astrbot_version: ">=4.10.4"
